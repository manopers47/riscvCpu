name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: Verilator regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Verilator
        run: |
          # Retry: the runner's apt mirror sometimes fails DNS lookups.
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 &&
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 verilator &&
              break
            echo "apt attempt $i failed, retrying in 15s"; sleep 15
          done
          verilator --version

      - name: Run testbench
        working-directory: sim
        run: make sim

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sim-logs
          path: sim/*.log
          retention-days: 14

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check every commit has a matching Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "ok   $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::Commit $(git log -1 --format='%h' "$c") has no 'Signed-off-by: $author'. Use 'git commit -s'; see CONTRIBUTING.md."
              fail=1
            fi
          done
          exit $fail
